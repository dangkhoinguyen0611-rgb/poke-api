<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex</title>
  <link rel="stylesheet" href="css.css" />
</head>
<body>
  <div class="scene">
    <div class="pokedex">
      <!-- NẮP TRÁI -->
      <div class="left-panel">
        <div class="top-lights">
          <div class="lens-outer">
            <div class="lens-inner"></div>
          </div>
          <span class="mini-led red"></span>
          <span class="mini-led yellow"></span>
          <span class="mini-led green"></span>
        </div>

        <div class="screen-frame">
          <div class="screen-dots">
            <span></span>
            <span></span>
          </div>
          <div class="screen-display">
            <img id="pokemon-img" src="" alt="Pokemon sprite" />
          </div>
          <div class="screen-bottom">
            <span class="red-btn"></span>
            <div class="speaker">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>
      </div>

      <!-- BẢN LỀ GIỮA -->
      <div class="hinge"></div>

      <!-- NẮP PHẢI -->
      <div class="right-panel">
        <div class="right-inner">
          <p class="hint-text">Select or press enter to get the result</p>

          <!-- Vẫn giữ select-option như bạn muốn -->
          <select id="pokemon-select" class="pokemon-select">
            <option value="">pikachu</option>
          </select>

          <div class="info-screen">
            <div class="info-grid">
              <div class="info-item">
                <div class="label">NAME</div>
                <div class="value" id="poke-name">Pikachu</div>
              </div>
              <div class="info-item">
                <div class="label">TYPE</div>
                <div class="value" id="poke-type">Electric</div>
              </div>
              <div class="info-item">
                <div class="label">HEIGHT</div>
                <div class="value" id="poke-height">0.4m</div>
              </div>
              <div class="info-item">
                <div class="label">WEIGHT</div>
                <div class="value" id="poke-weight">14lbs</div>
              </div>
            </div>

            <div class="bio-section">
              <div class="label">BIO</div>
              <div class="value bio-text" id="poke-bio">
                Has A 30% Chance Of Paralyzing Attacking Pokémon On Contact.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
